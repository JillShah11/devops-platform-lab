# ================================================================
# NAME: shown in the GitHub "Actions" tab
# ================================================================
name: ci

# ================================================================
# WHEN to run (the trigger)
#   - every push to the main branch
#   - every pull request that targets main
# ================================================================
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# ================================================================
# DEFAULT PERMISSIONS for the automatic GITHUB_TOKEN:
# read-only. A job must ask for more if it needs it (least privilege).
# ================================================================
permissions:
  contents: read

# ================================================================
# VARIABLES available to all jobs.
# github.repository = "your-username/devops-platform-lab"
# so IMAGE_NAME = ghcr.io/your-username/devops-platform-lab
# ================================================================
env:
  IMAGE_NAME: ghcr.io/${{ github.repository }}

# ================================================================
# JOBS: each job runs on its OWN fresh Ubuntu machine.
# Jobs 1 and 2 run at the same time. Job 3 waits for both.
# ================================================================
jobs:

  # ---------------- JOB 1: look for leaked passwords/keys ----------------
  secret-scan:
    runs-on: ubuntu-latest              # a fresh Ubuntu VM from GitHub
    steps:
      - uses: actions/checkout@v4       # download your repo's code onto the VM
        with:
          fetch-depth: 0                # include FULL Git history (old commits too)

      - name: Gitleaks
        # run the Gitleaks scanner as a container against the repo
        run: docker run --rm -v "$PWD:/repo" ghcr.io/gitleaks/gitleaks:v8.21.2 git /repo -v

  # ---------------- JOB 2: check code quality ----------------
  lint-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4       # download the code

      - uses: actions/setup-python@v5   # install Python 3.12 on the VM
        with:
          python-version: "3.12"
          cache: pip                    # remember downloaded packages for next time
          cache-dependency-path: app/requirements*.txt

      - name: Install dependencies      # same as on your laptop
        run: pip install -r app/requirements.txt -r app/requirements-dev.txt

      - name: Lint (ruff)               # style and error check
        run: ruff check .

      - name: Unit tests (pytest)       # your 2 tests
        run: python -m pytest -v

      - uses: azure/setup-helm@v4       # install Helm on the VM

      - name: Lint Helm chart           # check the chart is valid
        run: helm lint charts/devops-platform-lab

  # ---------------- JOB 3: build the Docker image and publish it ----------------
  build-push:
    needs: [secret-scan, lint-test]     # ONLY run if jobs 1 AND 2 passed
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write                   # this job may push images to GHCR
    steps:
      - uses: actions/checkout@v4

      - name: Image tags and labels     # work out the image name + tag
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.IMAGE_NAME }}
          tags: |
            type=sha,prefix=sha-,format=short   # tag = sha-<short commit id>, e.g. sha-a1b2c3d

      - uses: docker/setup-buildx-action@v3     # set up Docker's modern builder

      - name: Log in to GHCR            # log in to GitHub's image registry
        if: github.event_name == 'push' # only on push (not on pull requests)
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}          # your GitHub username
          password: ${{ secrets.GITHUB_TOKEN }}  # automatic short-lived token, no real password

      - name: Build and push            # docker build (+ push on main)
        id: build
        uses: docker/build-push-action@v6
        with:
          context: .                    # build using the Dockerfile in the repo root
          push: ${{ github.event_name == 'push' }}   # push on main; build-only on PRs
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha          # reuse layers from earlier runs (faster)
          cache-to: type=gha,mode=max

      - name: Summary                   # write the tag and digest on the run's page
        if: github.event_name == 'push'
        run: |
          echo "### Image published" >> "$GITHUB_STEP_SUMMARY"
          echo "Tags: ${{ steps.meta.outputs.tags }}" >> "$GITHUB_STEP_SUMMARY"
          echo "Digest: ${{ steps.build.outputs.digest }}" >> "$GITHUB_STEP_SUMMARY"