apiVersion: apps/v1
kind: Deployment
metadata:
  name: devops-platform-lab
  namespace: lab
  labels:
    app.kubernetes.io/name: devops-platform-lab
spec:
  replicas: 2
  selector:
    matchLabels:
      app.kubernetes.io/name: devops-platform-lab
  template:
    metadata:
      labels:
        app.kubernetes.io/name: devops-platform-lab
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: app
          image: devops-platform-lab:v3
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 8000
          env:
            - name: APP_VERSION
              value: "v3"
            - name: DB_HOST
              value: postgres
            - name: DB_NAME
              value: app
            - name: DB_USER
              valueFrom:
                secretKeyRef:
                  name: db-credentials
                  key: username
            - name: DB_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: wrong-creds
                  key: password